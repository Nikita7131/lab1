name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SIS-Lab1-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the apk branch
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/SIS-Lab1.apk
          cd out
          git init -q -b apk
          git add SIS-Lab1.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
